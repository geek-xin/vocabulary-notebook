// 逐级向上找匹配元素（不依赖 Element.closest，兼容老旧 WebView）
function closestEl(node, sel) {
  while (node && node !== document) {
    if (node.nodeType === 1) {
      if (node.matches && node.matches(sel)) return node;
      if (node.classList && node.classList.contains(sel.replace('.', ''))) return node;
    }
    node = node.parentNode;
  }
  return null;
}

// 分享文本：系统分享不可用时的兜底内容（标题 + 全部词条）
function buildShareText(book) {
  const lines = book.words.map(function (w, i) {
    const cn = (w.meaningCn && w.meaningCn !== '—') ? '  ' + w.meaningCn : '';
    return (i + 1) + '. ' + w.word + cn;
  });
  return book.title + '\n' + lines.join('\n');
}

/* ---------------------------------------------------------------
   系统分享的三条通道
   ---------------------------------------------------------------
   分享是本项目**唯一的跨设备搬运通道**（词汇本按 origin 隔离存储，不云同步），
   所以不能只有一条路，否则某个环境一断用户就没有任何搬运手段。

     1. 原生壳（Android）：WebView **不实现** Web Share API —— 壳内 navigator.share
        是 undefined。必须由 SharePlugin 落盘 + FileProvider 拉起系统分享面板。
        旧版只判断 navigator.share，Android 用户点分享只会看到「当前浏览器不支持」。
     2. Web / PWA / iOS 壳：走标准 navigator.share（可带文件，可发微信）。
     3. 都没有（桌面浏览器、file:// 单文件）：退回复制词表文本到剪贴板。

   通道选择必须**同步**完成：系统分享与剪贴板写入都要求用户激活
   （transient activation），一旦 await 过就丢，分享框不会弹。
   --------------------------------------------------------------- */
function nativeShare() {
  try {
    const C = window.Capacitor;
    if (!C || !C.Plugins || !C.Plugins.Share) return null;
    return C.Plugins.Share;
  } catch (e) { return null; }
}

function shareBook(id) {
  const book = books.find(function (b) { return b.id === id; });
  if (!book) { showToast('词汇本不存在'); return; }
  if (!book.words.length) { showToast('词汇本为空，无法分享'); return; }

  const native = nativeShare();
  if (native) { shareViaNative(native, book); return; }
  if (navigator.share) { shareViaWeb(book); return; }
  copyShareText(book);
}

/* 通道一：原生壳内交给 SharePlugin（落盘 → FileProvider → ACTION_SEND） */
function shareViaNative(plugin, book) {
  let html, fileName, text;
  try {
    html = buildShareHtml(book);
    fileName = safeFileName(book.title) + '.html';
    text = buildShareText(book);
  } catch (e) {
    console.warn('构造分享页失败:', e);
    showToast('分享失败：' + ((e && e.message) ? e.message : '无法生成分享页'), 5000);
    return;
  }

  showToast('正在准备分享…', 1600);
  plugin.shareHtml({
    html: html,
    fileName: fileName,
    title: book.title,
    text: text
  }).then(function (res) {
    // 用户在分享面板上点了返回：这是取消，不是失败，不弹提示
    if (res && res.dismissed) return;
    showToast('已分享「' + book.title + '」');
  }).catch(function (e) {
    console.warn('系统分享失败:', e);
    showToast('系统分享失败：' + ((e && e.message) ? e.message : '请稍后重试'), 6000);
  });
}

/* 通道二：标准 Web Share API（Web / PWA / iOS 壳） */
function shareViaWeb(book) {
  let data;
  try {
    const html = buildShareHtml(book);
    const fileName = safeFileName(book.title) + '.html';
    const text = buildShareText(book);
    const file = new File([html], fileName, { type: 'text/html' });
    data = (navigator.canShare && navigator.canShare({ files: [file] }))
      ? { files: [file], title: book.title, text: text }
      : { title: book.title, text: text };
  } catch (e) {
    console.warn('构造分享内容失败，退回文本分享:', e);
    data = { title: book.title, text: buildShareText(book) };
  }

  let settled = false;
  const hintTimer = setTimeout(function () {
    if (!settled) showToast('系统分享没有弹出，请稍后重试', 5000);
  }, 2000);

  try {
    navigator.share(data).then(function () {
      settled = true;
      clearTimeout(hintTimer);
      showToast('已分享「' + book.title + '」');
    }).catch(function (e) {
      settled = true;
      clearTimeout(hintTimer);
      if (e && e.name === 'AbortError') return;
      console.warn('系统分享失败:', e);
      showToast('系统分享失败：' + (e && e.message ? e.message : '当前浏览器不支持'), 6000);
    });
  } catch (e) {
    settled = true;
    clearTimeout(hintTimer);
    console.warn('系统分享异常:', e);
    showToast('系统分享失败：' + (e && e.message ? e.message : '当前浏览器不支持'), 6000);
  }
}

/* 通道三：复制词表文本。桌面浏览器与 file:// 单文件没有系统分享，
   至少让用户能把词表粘到聊天窗口里发出去。
   先走同步的 execCommand：剪贴板同样依赖用户激活，同步路径最稳；
   失败再退到异步的 Clipboard API。 */
function copyShareText(book) {
  const text = buildShareText(book);

  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) { showToast('已复制词表文本，粘贴到聊天窗口即可发送'); return; }
  } catch (e) { /* 落到异步剪贴板 API */ }

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('已复制词表文本，粘贴到聊天窗口即可发送');
      }).catch(function () {
        showToast('当前环境不支持系统分享，请用「下载」导出词汇本', 6000);
      });
      return;
    }
  } catch (e) { /* 落到下面的提示 */ }

  showToast('当前环境不支持系统分享，请用「下载」导出词汇本', 6000);
}

/* =========================================================
   2.9 下载应用本体 / 检查更新
   ---------------------------------------------------------
   - 首页右下角按钮把应用本体存成本地 HTML，离线可用
   - 本地副本打开时检查线上版本，有新版就在按钮上方提示
   - 下载取文两条路径：在线预取页面原文优先，失败则回退初始 DOM 原文
   - 取用必须同步：异步会丢失用户激活，部分浏览器会拦截下载
   ========================================================= */
const downloadFab    = document.getElementById('downloadFab');
const fabStack       = document.getElementById('fabStack');
const fabRow         = document.getElementById('fabRow');
const appVersionEl   = document.getElementById('appVersion');
const checkUpdateBtn = document.getElementById('checkUpdateBtn');

/* 在脚本执行的最早时刻留一份 DOM 原文：此刻还没有任何用户数据进入页面
   （词汇本卡片、学习页渲染出的词条、弹窗文案都还没写进来），
   file:// 下的下载直接输出它，从根上避免把词汇本内容带进副本。
   注意：这段必须是本区块第一条语句，且脚本位于 </body> 前（当前成立），
   否则抓到的可能是不完整的文档。 */
const pristineHtml = document.documentElement.outerHTML;

let selfHtmlText   = '';   // 在线时预取到的页面原文；为空则回退初始 DOM 原文
let remoteHtmlText = '';   // 检查更新时抓到的线上原文，供「更新」按钮直接复用

function downloadHtml(text, fileName) {
  const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

// file:// 下浏览器禁止 fetch 自身，只能回退到脚本执行时留下的 DOM 原文。
// 那份原文早于任何用户数据写入，所以副本天然不含词汇本内容，无需逐项清理。
function snapshotSelfHtml() {
  const doctype = /^\s*<!DOCTYPE/i.test(pristineHtml) ? '' : '<!DOCTYPE html>\n';
  return doctype + pristineHtml;
}

// 在线时预取页面原文，点击下载时同步取用
function prefetchSelfHtml() {
  if (location.protocol === 'file:') return;
  fetch(location.href.split('#')[0]).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.text();
  }).then(function (text) {
    if (text && text.indexOf('<!DOCTYPE') === 0) selfHtmlText = text;
  }).catch(function (e) {
    console.warn('预取页面原文失败，下载时改用快照:', e);
  });
}

function downloadAppHtml() {
  try {
    const html = selfHtmlText || snapshotSelfHtml();
    downloadHtml(html, APP_FILE_NAME);
    showToast('已下载 ' + APP_FILE_NAME);
  } catch (e) {
    console.warn('下载应用失败:', e);
    showToast('下载失败：' + ((e && e.message) ? e.message : '未知错误'), 5000);
  }
}

const REMOTE_VERSION_RE = /APP_VERSION\s*=\s*['"]([^'"]+)['"]/;

let pendingUpdateVersion = '';  // 检测到的更高版本号，空串表示没有更新
let pendingReleaseAsset  = '';  // Release 里 vocabulary-notebook.html 的下载地址
let pendingApkUrl        = '';  // Release 里 Android APK 的下载地址（应用内自更新用）
let releaseHtmlText      = '';  // 该附件已抓到的正文（按需取，避免每次检查都下载整包）

/* ---------------------------------------------------------------
   运行环境判定
   ---------------------------------------------------------------
   isNativeShell() 认出 Capacitor / 鸿蒙 Web 组件这类「原生壳」：
   壳内由安装包升级，不该走 HTML 下载，也不该被 isLocalCopy() 判成
   「本地副本需要检查更新」而反复弹提示条。
   isLocalCopy() 只认「下载到本地的单文件」：file://，或不是本站的普通 http(s) 页面。
   --------------------------------------------------------------- */
function isNativeShell() {
  try {
    // Capacitor 会往 window 注入 Capacitor（androidScheme=https 时这是唯一可靠信号）
    if (window.Capacitor && typeof window.Capacitor === 'object') return true;
    const p = String(location.protocol || '');
    if (p === 'file:') return false;                      // 纯 file:// 是本地单文件，不是原生壳
    if (p === 'capacitor:' || p === 'resource:' || p === 'ionic:' || p === 'app:') return true;
    const h = String(location.hostname || '');
    // Capacitor iOS 是 capacitor://localhost；鸿蒙 Web 组件是 resource://rawfile
    if ((h === 'localhost' || h === '127.0.0.1') && p !== 'https:' && p !== 'http:') return true;
    if (p.indexOf('http') !== 0) return true;             // 其它非 http(s) scheme：WebView 内置页面
    return false;
  } catch (e) { return false; }
}

// 本地副本才需要检查更新：线上访问时用户已经在最新版上
function isLocalCopy() {
  const p = String(location.protocol || '');
  if (p === 'file:') return true;                         // 下载的单文件 HTML
  if (isNativeShell()) return false;                      // 原生壳随安装包升级
  if (p !== 'http:' && p !== 'https:') return false;      // resource:// / blob: 等不参与
  return location.origin !== APP_ORIGIN;
}

/* 启动时要不要自动检查更新（manual=false）：
     - 本地副本（file:// / 非同站 http(s)）：要。用户手上的文件可能已经过期。
     - 原生壳（Capacitor / 鸿蒙 Web 组件）：**要**。壳内用户没有任何其它渠道
       知道出了新安装包，静默跳过等于永远不提示。
     - 线上 Web 端：不要。Service Worker 负责把新版本送上来，再弹提示条是打扰。
   isLocalCopy() 在原生壳内返回 false（壳不是「本地副本」），所以这里必须
   单独把 isNativeShell() 并进来，否则三端安装包会彻底收不到更新通知。 */
function shouldAutoCheck() {
  return isNativeShell() || isLocalCopy();
}

function parseVersion(v) {
  return String(v == null ? '' : v).split('.').map(function (n) {
    const x = parseInt(n, 10);
    return isFinite(x) ? x : 0;
  });
}

function compareVersion(a, b) {
  const x = parseVersion(a), y = parseVersion(b);
  const len = Math.max(x.length, y.length);
  for (let i = 0; i < len; i++) {
    const p = x[i] || 0, q = y[i] || 0;
    if (p > q) return 1;
    if (p < q) return -1;
  }
  return 0;
}

let updatePillEl   = null;
let updatePillMute = false;   // 点过「更新」后本次会话不再显示（旧文件还没被替换）

function ignoredVersion() {
  try { return localStorage.getItem(APP_IGNORED_KEY) || ''; } catch (e) { return ''; }
}

function ignoreVersion(v) {
  /* 原生壳内**不落盘**，忽略只对当次会话生效（showUpdatePill 的关闭按钮
     本来就会置 updatePillMute，所以本次会话照样静音）。
     理由：壳内用户无法靠「刷新页面」或「替换文件」消除提示，唯一的更新入口
     就是这条提示条。若把忽略的版本持久化，用户随手一关就再也收不到通知，
     只能等下次手动点「检查更新」——那正是「自动检查」要避免的。
     本地副本（file://）与线上则照旧持久化，因为用户确实能自己换文件。 */
  if (isNativeShell()) return;
  // file:// 下 localStorage 可能不可用，失败就只在本次会话内不提示
  try { localStorage.setItem(APP_IGNORED_KEY, v); } catch (e) {}
}

function clearUpdatePill() {
  if (updatePillEl && updatePillEl.parentNode) updatePillEl.parentNode.removeChild(updatePillEl);
  updatePillEl = null;
}

/* opts（可选）：
     text        自定义文案；默认「发现新版本 X」
     actionLabel 按钮文字；默认 Web 端「更新」、原生壳内「去下载」
     onAction    按钮回调；默认 updateToLatest
     replace     true 时允许顶掉已有的提示条（SW 更新优先于版本更新）
   不传 opts 时行为与改造前完全一致。 */
function showUpdatePill(version, force, opts) {
  if (!fabStack) return;
  if (updatePillEl) {
    if (!(opts && opts.replace)) return;
    clearUpdatePill();
  }
  if (updatePillMute && !force) return;
  if (force) updatePillMute = false;   // 用户主动查过了，解除本次会话的静音

  const pill = document.createElement('div');
  pill.className = 'update-pill';
  pill.id = 'updatePill';
  pill.innerHTML =
    '<span class="update-pill-dot" aria-hidden="true"></span>' +
    '<span class="update-pill-text"></span>' +
    '<button class="update-pill-btn" type="button">更新</button>' +
    '<button class="update-pill-close" type="button" aria-label="关闭更新提示">×</button>';
  // 版本号来自远端页面，必须用 textContent 写入，不能拼进 innerHTML
  const text = (opts && opts.text) ? opts.text : ('发现新版本 ' + version);
  pill.querySelector('.update-pill-text').textContent = text;

  // 按钮语义按运行形态区分：Web 端下载新 HTML；原生壳内只能去 Release 页
  const actBtn = pill.querySelector('.update-pill-btn');
  actBtn.textContent = (opts && opts.actionLabel) ? opts.actionLabel : (isNativeShell() ? '去下载' : '更新');
  actBtn.addEventListener('click', (opts && opts.onAction) ? opts.onAction : updateToLatest);
  pill.querySelector('.update-pill-close').addEventListener('click', function () {
    ignoreVersion(version);
    updatePillMute = true;
    clearUpdatePill();
  });

  // 插在这一行之前，与视觉上的「提示条在上、按钮在下」一致
  fabStack.insertBefore(pill, fabRow);
  updatePillEl = pill;
}

/* ---------------------------------------------------------------
   应用内自更新（Android）
   ---------------------------------------------------------------
   Android 不允许应用静默自装，唯一的「无感」路径是：
     下载 APK → 通过 FileProvider 交给系统安装器 → 用户点一次「安装」
   —— 相比跳到浏览器再手动找包，省掉了全部中间步骤。

   前提是 CI 端用**固定密钥**签名：Android 只允许同签名的包互相覆盖，
   签名不一致会直接拒绝安装（早期每次 CI 换一把 debug 密钥，根本升级不了）。

   插件在原生壳里不存在（Web/iOS）时自动降级回原来的行为。
   --------------------------------------------------------------- */
function nativeUpdater() {
  try {
    const C = window.Capacitor;
    if (!C || !C.Plugins || !C.Plugins.AppUpdater) return null;
    return C.Plugins.AppUpdater;
  } catch (e) { return null; }
}

// 从 Release 的 assets 里挑 Android 安装包
function pickApkAsset(release) {
  const assets = (release && release.assets) || [];
  for (let i = 0; i < assets.length; i++) {
    const a = assets[i] || {};
    if (/\.apk$/i.test(String(a.name || ''))) {
      const url = String(a.browser_download_url || '');
      if (url) return url;
    }
  }
  return '';
}

/* 在 Android 壳内执行应用内更新。返回 Promise；不可用时 reject，由调用方降级。 */
function installApkInApp(apkUrl) {
  const updater = nativeUpdater();
  if (!updater || !apkUrl) return Promise.reject(new Error('不可用'));

  showToast('正在下载新版本…', 6000);
  return updater.getStatus().then(function (st) {
    const go = function () {
      return updater.downloadAndInstall({ url: apkUrl });
    };
    // 没有「安装未知应用」权限时，先引导用户授权再重试
    if (st && st.canInstall === false) {
      showToast('请先允许本应用安装未知来源应用', 6000);
      return updater.openInstallPermissionSettings().then(function () {
        return { needsPermission: true };
      });
    }
    return go();
  }).then(function (res) {
    if (res && res.needsPermission) return res;
    showToast('已开始安装，请按提示完成', 6000);
    updatePillMute = true;
    clearUpdatePill();
    return res;
  });
}

/* 打开 Release 页：原生壳里没有「下载 HTML」这条路，只能引导去 Release 页取安装包 */
function openReleasePage() {
  try {
    if (!window.open(APP_RELEASE_PAGE, '_blank', 'noopener')) location.href = APP_RELEASE_PAGE;
  } catch (e) {
    try { location.href = APP_RELEASE_PAGE; } catch (e2) {}
  }
  updatePillMute = true;
  clearUpdatePill();
}

/* 从 Release 的 assets 里挑出应用本体（index.html 在 Release 里叫 vocabulary-notebook.html）。
   找不到就返回空串，交给调用方走 remoteHtmlText / APP_UPDATE_URL 兜底。 */
function pickReleaseAsset(release) {
  const assets = (release && release.assets) || [];
  for (let i = 0; i < assets.length; i++) {
    const a = assets[i] || {};
    const name = String(a.name || '');
    if (name === APP_RELEASE_ASSET || /\.html?$/i.test(name)) {
      const url = String(a.browser_download_url || '');
      if (url) return url;
    }
  }
  return '';
}

// 用检查时已抓到的原文直接下载，不重复请求；做了缓存丢失的兜底
function updateToLatest() {
  const finish = function (text) {
    downloadHtml(text, APP_FILE_NAME);
    showToast('新版本已下载，替换当前文件即可；词汇本数据不会丢失', 6000);
    updatePillMute = true;
    clearUpdatePill();
  };

  // 原生壳：安装包升级，不能下载 HTML 覆盖自身。
  // Android 优先走「应用内下载 + 拉起安装器」的无感路径；插件不可用（或 iOS）时退回 Release 页。
  if (isNativeShell()) {
    const apk = pendingApkUrl || '';
    if (apk && nativeUpdater()) {
      installApkInApp(apk).catch(function (e) {
        console.warn('应用内更新失败，退回 Release 页:', e);
        openReleasePage();
      });
      return;
    }
    openReleasePage();
    return;
  }

  if (remoteHtmlText) { finish(remoteHtmlText); return; }

  // Release 附件优先：先看检查时是否已经抓到，没有就现取（带超时）
  const assetUrl = pendingReleaseAsset;
  const useAsset = function () {
    if (releaseHtmlText) { finish(releaseHtmlText); return Promise.resolve(); }
    if (!assetUrl) return Promise.reject(new Error('没有 Release 附件'));
    return fetchText(assetUrl, APP_UPDATE_TIMEOUT).then(function (text) {
      releaseHtmlText = text;
      finish(text);
    });
  };

  useAsset().catch(function (e) {
    if (assetUrl) console.warn('Release 附件下载失败，回退线上页面:', e);
    // 回退：抓线上 index.html（APP_UPDATE_URL）
    return fetchText(APP_UPDATE_URL, APP_UPDATE_TIMEOUT).then(finish);
  }).catch(function (e) {
    console.warn('下载新版本失败:', e);
    showToast('下载新版本失败，请检查网络后重试', 5000);
  });
}

/* 统一的带超时取文本。失败一律 reject，由调用方决定是回退还是提示。
   ctrl 为 null（老浏览器没有 AbortController）时退化为「无超时」。 */
function fetchText(url, timeoutMs, opts) {
  const ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
  const timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeoutMs || APP_UPDATE_TIMEOUT) : null;
  const init = { signal: ctrl ? ctrl.signal : undefined };
  if (opts && opts.headers) init.headers = opts.headers;
  return fetch(url, init).then(function (res) {
    if (timer) clearTimeout(timer);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.text();
  }, function (e) {
    if (timer) clearTimeout(timer);
    throw e;
  });
}

/* 首选通道：GitHub Releases API。
   成功 → { version, assetUrl, text }；任何异常都 reject，由 checkUpdate 静默回退。 */
function fetchReleaseInfo() {
  return fetchText(APP_RELEASES_API, APP_UPDATE_TIMEOUT, {
    // GitHub API 不接受 text/html，显式声明；未认证请求受 60 次/小时/IP 限流，超限返回 403
    headers: { 'Accept': 'application/vnd.github+json' }
  }).then(function (body) {
    let data;
    try { data = JSON.parse(body); } catch (e) { throw new Error('Release 响应不是合法 JSON'); }
    const tag = String((data && data.tag_name) || '').trim();
    const version = tag.replace(/^v/i, '');
    if (!/^\d{4}\.\d{2}\.\d{2}(\.\d+)?$/.test(version)) {
      throw new Error('tag_name 不是 YYYY.MM.DD[.N] 格式: ' + tag);
    }
    return { version: version, assetUrl: pickReleaseAsset(data), apkUrl: pickApkAsset(data), text: '' };
  });
}

/* 回退通道：抓线上 index.html，正则取 APP_VERSION（GitHub API 限流 / 离线 / 接口异常时用） */
function fetchOnlineVersion() {
  return fetchText(APP_UPDATE_URL, APP_UPDATE_TIMEOUT).then(function (text) {
    const m = text.match(REMOTE_VERSION_RE);
    if (!m) throw new Error('读不到版本号');
    return { version: m[1], assetUrl: '', apkUrl: '', text: text };
  });
}

/* 按已确认的更新信息落地：记状态 → 提示条 → 手动时再给一条 toast */
function applyUpdate(info, manual) {
  pendingUpdateVersion = info.version;
  pendingReleaseAsset  = info.assetUrl || '';
  pendingApkUrl        = info.apkUrl || '';
  remoteHtmlText       = info.text || '';
  releaseHtmlText      = '';
  // manual 时 force：用户刚主动查过，即使之前关掉过提示条也要重新提示
  showUpdatePill(info.version, manual);
  if (manual) showToast('发现新版本 ' + info.version);
}

/* manual=true 是用户主动点「检查更新」：任何打开方式下都执行，且结果必须明确反馈；
   manual=false 是打开本地副本时的自动检查：只在本地副本跑，全程静默。
   顺序：GitHub Release（首选） → 线上 index.html（回退）；两条都失败才在手动时提示失败。 */
function checkUpdate(manual) {
  if (!manual) {
    if (!shouldAutoCheck()) return Promise.resolve();
    if (navigator.onLine === false) return Promise.resolve();  // 离线时省掉必然失败的请求
  }

  return fetchReleaseInfo().catch(function (e) {
    // 网络错误 / HTTP 非 2xx（403 限流最常见）/ tag_name 解析不出 / 8 秒超时，全部走这里
    console.warn('Release 通道不可用，回退到线上页面版本:', e && e.message ? e.message : e);
    return fetchOnlineVersion();
  }).then(function (info) {
    if (compareVersion(info.version, APP_VERSION) <= 0) {
      if (manual) showToast('已是最新版本（v' + APP_VERSION + '）');
      return;
    }
    if (!manual) {
      const ignored = ignoredVersion();
      if (ignored && compareVersion(info.version, ignored) <= 0) return;  // 用户已忽略这个版本
    }
    applyUpdate(info, manual);
  }).catch(function (e) {
    // 两条通道都失败：自动检查完全静默，手动检查必须给明确反馈
    console.warn('检查更新失败:', e);
    if (manual) showToast('检查失败，请检查网络后重试', 5000);
  });
}

function manualCheckUpdate() {
  if (!checkUpdateBtn || checkUpdateBtn.disabled) return;
  checkUpdateBtn.disabled = true;
  checkUpdateBtn.classList.add('checking');   // 图标旋转，替代文字反馈
  const restore = function () {
    checkUpdateBtn.disabled = false;
    checkUpdateBtn.classList.remove('checking');
  };
  const p = checkUpdate(true);
  if (p && p.then) p.then(restore, restore); else restore();
}

if (appVersionEl) appVersionEl.textContent = 'v' + APP_VERSION;   // 版本号常驻显示

if (isNativeShell()) {
  /* 原生壳（Capacitor / 鸿蒙 Web 组件）里「下载应用 HTML」没有意义：
     应用就在安装包里，覆盖不了自身。语义改成「去 Release 页下载安装包」，
     按钮不隐藏，位置与图标保持不变，只换行为与说明文字。 */
  if (downloadFab) {
    downloadFab.title = '打开 Release 页下载安装包（当前 v' + APP_VERSION + '）';
    downloadFab.setAttribute('aria-label', '打开 Release 页下载安装包');
    downloadFab.addEventListener('click', openReleasePage);
  }
} else if (downloadFab) {
  // 版本号是脚本常量，title 由 JS 写入，避免静态 HTML 里写死后与常量脱节
  downloadFab.title = '下载应用 HTML（当前 ' + APP_VERSION + '）';
  downloadFab.addEventListener('click', downloadAppHtml);
}

if (checkUpdateBtn) checkUpdateBtn.addEventListener('click', manualCheckUpdate);
prefetchSelfHtml();
setTimeout(function () { checkUpdate(false); }, 1500);

/* =========================================================
   2.9.1 Service Worker：离线外壳 + 版本更新
   ---------------------------------------------------------
   - 只在 https:（或 localhost / 127.0.0.1 的 http）下注册。
     file:// 无法注册 SW；Capacitor（capacitor://localhost、https://localhost）
     与鸿蒙 Web 组件（resource://rawfile）也不注册，避免无谓报错。
   - 新 SW 装好后不立刻接管：页面弹「有新版本」提示条，用户点了才
     skipWaiting + 重载。这样正在学习时不会被强制刷新。
   ========================================================= */
function swSupported() {
  if (!('serviceWorker' in navigator)) return false;
  const p = String(location.protocol || '');
  if (p === 'file:') return false;                       // 单文件直开：没有 SW
  if (isNativeShell()) return false;                     // 原生壳内由安装包升级
  if (p === 'https:') return true;
  const h = String(location.hostname || '');
  return p === 'http:' && (h === 'localhost' || h === '127.0.0.1' || h === '[::1]');
}

let swReloading = false;

function offerSwUpdate(reg) {
  if (!reg || !reg.waiting) return;
  showUpdatePill('', true, {
    replace: true,   // SW 更新比版本号提示更该被看到，允许顶掉它
    text: '应用已更新到新版本',
    actionLabel: '刷新',
    onAction: function () {
      updatePillMute = true;
      clearUpdatePill();
      const waiting = reg.waiting;
      if (!waiting) { location.reload(); return; }
      swReloading = true;
      // 兜底：万一 controllerchange 没触发（例如页面此前没有 controller），也要刷新
      setTimeout(function () { if (swReloading) location.reload(); }, 1200);
      waiting.postMessage({ type: 'SKIP_WAITING' });
    }
  });
}

if (swSupported()) {
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!swReloading) return;
    swReloading = false;
    location.reload();
  });

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { scope: './' }).then(function (reg) {
      // 已经有一个装好、在等接管的新 SW（例如上次没点刷新）
      if (reg.waiting && navigator.serviceWorker.controller) offerSwUpdate(reg);

      reg.addEventListener('updatefound', function () {
        const installing = reg.installing;
        if (!installing) return;
        installing.addEventListener('statechange', function () {
          if (installing.state !== 'installed') return;
          // 首次安装（页面还没有 controller）不需要打扰用户
          if (!navigator.serviceWorker.controller) return;
          offerSwUpdate(reg);
        });
      });
    }).catch(function (e) {
      // 注册失败不能影响应用本体：静默记一条日志即可
      console.warn('Service Worker 注册失败:', e);
    });
  });
}

/* =========================================================
   2.10 深 / 浅色主题
   ---------------------------------------------------------
   - 首帧由 <head> 里的内联脚本按 localStorage / 系统偏好写到 <html data-theme>
   - 这些按钮只负责切换与持久化，并把图标 / aria-label 同步到当前主题
   - 用户没手动选过时跟随系统，系统主题变化会实时生效
   ========================================================= */
const THEME_KEY = 'vn_theme_v1';
const themeToggles = Array.prototype.slice.call(document.querySelectorAll('.theme-toggle'));
let themeFollowsSystem = true;

function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}

function syncThemeUi() {
  const light = currentTheme() === 'light';
  const label = light ? '切换到深色模式' : '切换到浅色模式';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', light ? '#eef4fb' : '#0f1724');
  themeToggles.forEach(function (btn) {
    btn.setAttribute('aria-label', label);
    btn.title = label;
  });
}

function applyTheme(theme) {
  const next = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  syncThemeUi();
}

function toggleTheme() {
  const next = currentTheme() === 'light' ? 'dark' : 'light';
  themeFollowsSystem = false;
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  themeFollowsSystem = saved !== 'light' && saved !== 'dark';
  applyTheme(themeFollowsSystem
    ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark')
    : saved);

  themeToggles.forEach(function (btn) { btn.addEventListener('click', toggleTheme); });

  // 系统主题变化：只在用户没手动选择过时跟随
  try {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    const onChange = function () { if (themeFollowsSystem) applyTheme(mq.matches ? 'light' : 'dark'); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  } catch (e) {}
})();

/* =========================================================
   3. 渲染
   ========================================================= */
function renderChips(container, items, type) {
  container.innerHTML = '';
  if (!items || !items.length) {
    const span = document.createElement('span');
    span.className = (type === 'syn' ? 'syn-item' : 'ant-item') + ' empty';
    span.textContent = '—';
    container.appendChild(span);
    return;
  }
  items.forEach(function (text) {
    const span = document.createElement('span');
    span.className = type === 'syn' ? 'syn-item' : 'ant-item';
    span.textContent = text;
    container.appendChild(span);
  });
}

function renderWord(index) {
  const data = wordsData[index];
  if (!data) return;

  frontWord.textContent      = data.word;
  frontPos.textContent       = data.pos || '—';
  frontPhonetic.textContent  = data.phonetic || '';
  frontMeaningEn.textContent = data.meaningEn || '—';
  frontMeaningCn.textContent = data.meaningCn || '—';
  frontExample.textContent   = data.example || '—';

  backWord.textContent     = data.word;
  backPhonetic.textContent = [data.phonetic, data.pos].filter(Boolean).join(' · ');
  backExample.textContent  = data.example || '—';

  /* 例句目前没有任何可跨域的在线来源（见 7.5 节说明），所以绝大多数卡片
     的 example 是空的。留一个永远显示「—」的区块只会占地方，
     这里整块隐藏；将来若接上例句源，有值时会自动恢复显示。 */
  if (frontExampleBox) frontExampleBox.hidden = !data.example;
  backExample.hidden = !data.example;

  renderChips(synList, data.synonyms, 'syn');
  renderChips(antList, data.antonyms, 'ant');

  counter.textContent = (index + 1) + ' / ' + wordsData.length;

  /* 页眉与页码。页眉右栏放词条，翻页时也能一眼看到当前是哪一页；
     页码与顶部计数器同源，只是换了个「书」的说法。 */
  if (frontRunhead) frontRunhead.textContent = currentBookTitle;
  if (backRunhead) backRunhead.textContent = currentBookTitle;
  if (frontRunheadWord) frontRunheadWord.textContent = data.word || '';
  /* 页码只写数字：顶部那个「1 / 4」是可点击的跳转控件，
     这里重复一遍既啰嗦又抢眼；书页上的 folio 本来就只印一个页码。 */
  if (frontFolio) frontFolio.textContent = String(index + 1);
  if (backFolio) backFolio.textContent = String(index + 1);

  if (isFlipped) {
    flashcard.classList.remove('flipped');
    isFlipped = false;
  }

  setLastIndex(currentBookId, index);
}

/* =========================================================
   3.5 切换卡片的过渡动画
   ---------------------------------------------------------
   四个切换入口（随机 / 顺序 / ← → 方向键 / 页码跳转）走 switchTo；
   进入学习页、联网补全后刷新、启动回填后刷新仍直接调 renderWord ——
   那三处不是用户主动切换，瞬间替换才是对的。

   两拍动画：退出（卡片不可见）→ 换内容 → 进入。
   换内容发生在卡片不可见的那一瞬间，所以看不到文字跳变。
   ========================================================= */
const SWITCH_OUT_MS = 130;   // 退出拍
const SWITCH_IN_MS  = 220;   // 进入拍
const SWITCH_SHIFT  = 8;     // 位移量：卡片宽度的 8%

const DIR_NEXT = 1;    // 向前：旧卡向左滑出，新卡从右侧滑入
const DIR_PREV = -1;   // 向后：旧卡向右滑出，新卡从左侧滑入

let switching = false;       // 是否正在播切换动画
let switchAnim = null;       // 当前动画对象，用于连按时取消

/* Web Animations API 不受 CSS 的 prefers-reduced-motion 媒体查询管辖，
   必须在 JS 里自行判定（文件别处已用 matchMedia，用法一致）。 */
function prefersReducedMotion() {
  return !!(window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

/* 收尾：取消动画、摘掉 .switching、恢复翻面过渡可用。
   先 cancel 再摘 class —— 让 transform 在过渡被禁用时就落回原位，避免回弹。
   回调先置 null，防止 cancel 触发 onfinish/oncancel 重入。 */
function cancelSwitch() {
  if (switchAnim) {
    const anim = switchAnim;
    switchAnim = null;
    anim.onfinish = null;
    try { anim.cancel(); } catch (e) {}
  }
  flashcard.classList.remove('switching');
  switching = false;
}

/* 切换到 index。
   direction 取 DIR_NEXT / DIR_PREV；传 0 表示不播动画。 */
function switchTo(index, direction) {
  const data = wordsData[index];
  if (!data) return;

  // 先算「要不要播动画」：目标页即当前页（如单张卡上绕回自身）、无方向、减弱动效 → 不播
  const animated = index !== currentIndex && !!direction && !prefersReducedMotion();

  // 上一次还没播完：直接作废它，本次瞬间替换（连按不卡顿、不重叠）
  const wasSwitching = switching;
  if (wasSwitching) cancelSwitch();

  currentIndex = index;

  if (!animated || wasSwitching) {
    renderWord(currentIndex);
    return;
  }

  switching = true;
  flashcard.classList.add('switching');

  const out = direction === DIR_NEXT ? -1 : 1;    // 退出方向（向左为负）
  const fromRotate = isFlipped ? 180 : 0;         // 在背面时，退出拍顺带转回正面

  const outAnim = flashcard.animate(
    [
      { transform: 'translateX(0%) rotateY(' + fromRotate + 'deg)', opacity: 1 },
      { transform: 'translateX(' + (out * SWITCH_SHIFT) + '%) rotateY(0deg)', opacity: 0 }
    ],
    { duration: SWITCH_OUT_MS, easing: 'ease-in', fill: 'forwards' }
  );
  switchAnim = outAnim;

  outAnim.onfinish = function () {
    if (switchAnim !== outAnim) return;   // 已被取消或被新的切换取代

    // 卡片此刻完全不可见：换内容，并把翻转态归零
    if (isFlipped) {
      flashcard.classList.remove('flipped');
      isFlipped = false;
    }
    renderWord(currentIndex);

    const inAnim = flashcard.animate(
      [
        { transform: 'translateX(' + (-out * SWITCH_SHIFT) + '%) rotateY(0deg)', opacity: 0 },
        { transform: 'translateX(0%) rotateY(0deg)', opacity: 1 }
      ],
      { duration: SWITCH_IN_MS, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }
    );
    switchAnim = inAnim;

    inAnim.onfinish = function () {
      if (switchAnim !== inAnim) return;
      cancelSwitch();
    };
  };
}

/* =========================================================
   4. 有道英式发音
   ---------------------------------------------------------
   接口：https://dict.youdao.com/dictvoice?audio=WORD&type=1
   type=1 → 英式发音
   ⚠️ 不要设置 audio.crossOrigin，否则会触发 CORS 检查导致加载失败
   ========================================================= */
let pronouncing = false;

function setAudioBtnBusy(on) {
  if (!audioBtn) return;
  audioBtn.classList.toggle('speaking', !!on);
}

function speakWord(word) {
  if (!word || pronouncing) return;
  pronouncing = true;
  setAudioBtnBusy(true);

  function finish() {
    pronouncing = false;
    setAudioBtnBusy(false);
  }

  const url = 'https://dict.youdao.com/dictvoice?audio=' +
              encodeURIComponent(word) + '&type=1';

  let audio;
  try {
    audio = new Audio();
    audio.preload = 'auto';
    // 绝对不要设置 crossOrigin
    audio.src = url;
  } catch (e) {
    console.warn('Audio create fail:', e);
    showToast('语音播放失败');
    finish();
    return;
  }

  let done = false;
  function doneOnce(ok, msg) {
    if (done) return;
    done = true;
    if (!ok) showToast(msg || '语音播放失败');
    finish();
  }

  audio.onended = function () { doneOnce(true); };
  audio.onerror = function (e) {
    console.warn('Audio error:', e);
    doneOnce(false, '音频加载失败');
  };
  setTimeout(function () { doneOnce(false, '播放超时'); }, 10000);

  try {
    const p = audio.play();
    if (p && typeof p.then === 'function') {
      p.catch(function (err) {
        console.warn('play() rejected:', err);
        doneOnce(false, '播放失败，请点击页面任意位置后重试');
      });
    }
  } catch (e) {
    console.warn('play() throw:', e);
    doneOnce(false, '播放失败');
  }
}

/* =========================================================
   5. 音频解锁（夸克 / 微信等环境需要）
   ========================================================= */
let audioCtx = null;
try {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
} catch (e) {}

function unlockAudio() {
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(function () {});
  }
  try {
    const silent = new Audio();
    silent.volume = 0;
    silent.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    silent.play().catch(function () {});
  } catch (e) {}
}

document.addEventListener('click', function once() {
  unlockAudio();
  document.removeEventListener('click', once);
}, { once: true });

document.addEventListener('touchstart', function once() {
  unlockAudio();
  document.removeEventListener('touchstart', once);
}, { once: true, passive: true });

/* =========================================================
   6. Toast
   ========================================================= */
let toastTimer = null;
function showToast(msg, ms) {
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    toastEl.classList.remove('show');
  }, ms || 2400);
}

/* =========================================================
   7. 导入（.docx / .pdf / .txt）
   ---------------------------------------------------------
   从 .docx / .pdf / .txt 中提取英文词条。
        - .docx / .pdf 需要 CDN 解析库；.txt 只需解码，无需联网
        - 提取出的每个词条都先建成空卡（释义 '—'）
        - 释义由 7.5 节的在线词典在导入完成后补齐
   ========================================================= */
/* =========================================================
   解析库按需加载：多 CDN 依次重试
   ---------------------------------------------------------
   国内网络下 cdnjs / jsdelivr 可能不可达，故按序兜底：
   jsdelivr → BootCDN（国内） → cdnjs
   ========================================================= */
const LIB_SOURCES = {
  mammoth: [
    'https://cdn.jsdelivr.net/npm/mammoth@1.4.16/mammoth.browser.min.js',
    'https://cdn.bootcdn.net/ajax/libs/mammoth/1.4.16/mammoth.browser.min.js',
    'https://cdn.staticfile.org/mammoth/1.4.16/mammoth.browser.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.16/mammoth.browser.min.js'
  ],
  pdfjs: [
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
    'https://cdn.bootcdn.net/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'
  ]
};

const PDF_WORKERS = [
  'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
  'https://cdn.bootcdn.net/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'
];

function loadScriptOnce(url) {
  return new Promise(function (resolve, reject) {
    const s = document.createElement('script');
    s.src = url;
    s.async = true;
    const timer = setTimeout(function () { reject(new Error('超时: ' + url)); }, 20000);
    s.onload = function () { clearTimeout(timer); resolve(true); };
    s.onerror = function () { clearTimeout(timer); reject(new Error('失败: ' + url)); };
    document.head.appendChild(s);
  });
}

async function ensureLib(key, globalName) {
  if (window[globalName]) return true;
  const urls = LIB_SOURCES[key] || [];
  for (let i = 0; i < urls.length; i++) {
    try {
      await loadScriptOnce(urls[i]);
      if (window[globalName]) return true;
    } catch (e) {
      console.warn('CDN 不可用，尝试下一个：' + urls[i], e && e.message);
    }
  }
  return !!window[globalName];
}

// 点击按钮 -> 打开文件选择框（透明文件框优先由原生处理，落在按钮本身时用 JS 兜底）
importBtn.addEventListener('click', function (e) {
  if (e.target === importFile) return;
  try { importFile.click(); } catch (err) { console.warn('文件选择器无法打开:', err); }
});
importBtn.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    try { importFile.click(); } catch (err) { console.warn('文件选择器无法打开:', err); }
  }
});

importFile.addEventListener('change', function (e) {
  // 先复制成数组：input.value='' 会清空实时 FileList
  const files = Array.prototype.slice.call(e.target.files || []);
  importFile.value = '';
  importFiles(files);
});

// 一批文件（.docx / .pdf / .txt）：每个文件生成一个独立词汇本
async function importFiles(fileList) {
  const files = Array.prototype.slice.call(fileList || []);

  if (!files.length) {
    showToast('没有选择文件');
    return;
  }

  showToast('正在导入 ' + files.length + ' 个文件…', 1600);

  const pending = books.slice();
  const added = [];
  const dupNames = [];
  const rejNames = [];
  const unusedLines = [];
  let parsedTotal = 0;
  let dupTotal = 0;
  let rejTotal = 0;
  let unusedTotal = 0;
  let failed = 0;

  const errors = [];

  // 串行解析，手机端内存更稳
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    try {
      const buf = await readArrayBuffer(file);
      let kind = fileKind(file);
      if (!kind) kind = sniffKind(buf);

      let parsed;
      if (kind === 'pdf') {
        if (!await ensureLib('pdfjs', 'pdfjsLib')) throw new Error('PDF 解析库加载失败（网络受限）');
        await ensurePdfWorker();
        parsed = await parsePdfBuffer(buf);
      } else if (kind === 'docx') {
        if (!await ensureLib('mammoth', 'mammoth')) throw new Error('Word 解析库加载失败（网络受限）');
        parsed = await parseDocxBuffer(buf);
      } else if (kind === 'txt') {
        // 纯文本词表：不需要任何 CDN 库，网络受限 / file:// 下同样可用
        parsed = parseWordList(decodeTextBuffer(buf), { plain: true });
      } else {
        throw new Error('不是 .docx / .pdf / .txt 文件');
      }

      const st = parseWordList.lastStats;
      if (st) {
        dupTotal += st.duplicates.length;
        rejTotal += st.rejected.length;
        unusedTotal += st.unused.length;
        st.duplicates.forEach(function (w) { if (dupNames.length < 12) dupNames.push(w); });
        st.rejected.forEach(function (w) { if (rejNames.length < 12) rejNames.push(w); });
        st.unused.forEach(function (w) { if (unusedLines.length < 40) unusedLines.push(w); });
      }
      if (!parsed.length) { failed++; continue; }
      parsedTotal += parsed.length;
      const base = file.name.replace(/\.(docx|pdf|txt)$/i, '').trim() || '未命名词汇本';
      const book = {
        id: makeId(),
        title: uniqueTitle(pending, base),
        createdAt: Date.now(),
        words: parsed
      };
      pending.push(book);
      added.push(book);
    } catch (err) {
      console.warn('导入失败:', file.name, err);
      errors.push((file.name || '文件') + '：' + ((err && err.message) ? err.message : '解析失败'));
      failed++;
    }
  }

  if (!added.length) {
    const why = errors.length ? errors.slice(0, 2).join('；') : '没有解析到有效单词';
    showToast('导入失败：' + why, 8000);
    if (errors.length) showReport('导入失败\n' + errors.join('\n'));
    return;
  }
  if (!await saveBooks(pending)) return;
  books = pending;

  /* 数据在这一刻已经落盘；骨架卡只是同一个 book 的临时呈现形态。
     新词汇本先以「联网补全中」的骨架卡出现，补全成功后才换成真实卡片。 */
  added.forEach(function (b) { markPendingLoading(b.id, b.words.length); });
  renderHome();
  runEnrichForNewBooks(added);

  const skipped = rejTotal + unusedTotal;
  let msg = '已导入 ' + added.length + ' 个词汇本 · ' + parsedTotal + ' 词';
  if (failed) msg += ' · ' + failed + ' 个文件失败';
  if (dupTotal) msg += ' · 合并重复 ' + dupTotal;
  if (skipped) msg += ' · 未识别 ' + skipped + ' 行';
  showToast(msg + (skipped ? '（见报告）' : '') + ' · 联网补全中…', skipped ? 6000 : 3200);

  if (dupTotal || skipped || errors.length) {
    showReport(formatImportReport({
      parsedTotal: parsedTotal,
      dupTotal: dupTotal,
      skipped: skipped,
      dupNames: dupNames,
      unusedLines: unusedLines,
      rejNames: rejNames,
      errors: errors
    }));
  }
}

// 统一用 FileReader 读文件（比 file.arrayBuffer() 兼容性更好）
function readArrayBuffer(file) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onerror = function () { reject(reader.error || new Error('读取文件失败')); };
    reader.onload = function (evt) { resolve(evt.target.result); };
    reader.readAsArrayBuffer(file);
  });
}

/* 纯文本词表解码。文本文件可能是 UTF-8 / UTF-16 / GBK，必须显式判定：
   顺序 BOM -> 含 NUL（无 BOM 的 UTF-16）-> 严格 UTF-8 -> GBK -> 非严格 UTF-8。
   第 4 步是 GBK 词表（如 PET 2.txt）能正确打开的关键。 */
function decodeTextBuffer(buf) {
  if (typeof TextDecoder === 'undefined') {
    throw new Error('当前浏览器不支持文本解码（TextDecoder），无法导入 .txt');
  }
  const bytes = new Uint8Array(buf);

  // 1) BOM 直接给出编码
  if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
    return decodeWith('utf-8', bytes.subarray(3), false);
  }
  if (bytes[0] === 0xFF && bytes[1] === 0xFE) return decodeWith('utf-16le', bytes.subarray(2), false);
  if (bytes[0] === 0xFE && bytes[1] === 0xFF) return decodeWith('utf-16be', bytes.subarray(2), false);

  // 2) 无 BOM 的 UTF-16：纯文本里 NUL 字节没有正当用途，而 NUL 本身是合法 UTF-8，
  //    放着不管会「成功」解出一串夹着 NUL 的垃圾，属于静默出错
  if (hasNulByte(bytes)) {
    const wide = decodeWith('utf-16le', bytes, true);
    if (wide && wide.indexOf('\u0000') < 0) return wide;
  }

  // 3) 严格 UTF-8：解不通就说明不是 UTF-8
  const strict = decodeWith('utf-8', bytes, true);
  if (strict) return strict;

  // 4) GBK
  const gbk = decodeWith('gbk', bytes, true);
  if (gbk) return gbk;

  // 5) 兜底：非严格 UTF-8，用替换字符保证导入不直接失败
  return decodeWith('utf-8', bytes, false);
}

// fatal=true 时编码不合法会抛错，这里统一转成空串表示「解不了」
function decodeWith(label, bytes, fatal) {
  try {
    return new TextDecoder(label, fatal ? { fatal: true } : undefined).decode(bytes);
  } catch (e) {
    return '';
  }
}

function hasNulByte(bytes) {
  const end = Math.min(bytes.length, 4096);
  for (let i = 0; i < end; i++) {
    if (bytes[i] === 0x00) return true;
  }
  return false;
}

// 先按扩展名 / MIME 判断；都判断不出来时按文件头判断
function fileKind(file) {
  const name = (file.name || '').toLowerCase();
  if (name.length >= 4 && name.slice(-4) === '.pdf') return 'pdf';
  if (name.length >= 5 && name.slice(-5) === '.docx') return 'docx';
  if (name.length >= 4 && name.slice(-4) === '.txt') return 'txt';
  const type = (file.type || '').toLowerCase();
  if (type.indexOf('pdf') >= 0) return 'pdf';
  if (type.indexOf('wordprocessingml') >= 0 || type.indexOf('msword') >= 0) return 'docx';
  if (type.indexOf('text/plain') >= 0) return 'txt';
  return '';
}

function sniffKind(buf) {
  const b = new Uint8Array(buf.slice(0, 5));
  if (b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return 'pdf';  // %PDF
  if (b[0] === 0x50 && b[1] === 0x4B) return 'docx';                                   // PK.. (zip)
  return '';
}

async function parseDocxBuffer(buf) {
  if (typeof mammoth === 'undefined') throw new Error('Word 解析库未加载');
  const result = await mammoth.convertToHtml({ arrayBuffer: buf });
  return parseWordList(result.value);
}

// 跨域 worker 会被浏览器拦截，先把 worker 脚本取回来转成同源 Blob
async function ensurePdfWorker() {
  if (!window.pdfjsLib || !pdfjsLib.GlobalWorkerOptions) return;
  if (pdfjsLib.GlobalWorkerOptions.workerSrc) return;
  for (let i = 0; i < PDF_WORKERS.length; i++) {
    try {
      const res = await fetch(PDF_WORKERS[i], { mode: 'cors' });
      if (!res.ok) continue;
      const code = await res.text();
      if (code.length < 1000) continue;
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      return;
    } catch (e) {
      console.warn('worker 加载失败:', PDF_WORKERS[i], e && e.message);
    }
  }
}

// PDF：用 pdf.js 抽取文本，再交给同一套词条解析
async function parsePdfBuffer(buf) {
  if (typeof pdfjsLib === 'undefined') throw new Error('PDF 解析库未加载');
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  let text = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const parts = [];
    content.items.forEach(function (item) {
      if (item && typeof item.str === 'string') parts.push(item.str);
      parts.push(item && item.hasEOL ? '\n' : ' ');
    });
    text += parts.join('') + ' ';
  }
  if (text.replace(/\s/g, '').length < 10) {
    throw new Error('PDF 里没有可提取的文字（可能是扫描图片）');
  }
  return parseWordList(text);
}

// HTML -> 段落文本（保留 <p>/<li> 等块级边界）
function htmlToBlocks(html) {
  return String(html == null ? '' : html)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(p|div|li|h[1-6]|tr|td|th)\s*>/gi, '\n')
    .replace(/<[^>]*>/g, ' ')
    .replace(/&nbsp;/gi, ' ')
    .replace(/&amp;/gi, '&')
    .replace(/&lt;/gi, '<')
    .replace(/&gt;/gi, '>')
    .replace(/[ \t\u00a0]+/g, ' ');
}

// 行内编号：1. / 1．/ 1。 / 1、 / 1, / 1: / 1) / （1） / 1- 等
const NUMBERED_RE = /(?:^|[\s\u3000])\(?(\d{1,4})\)?\s*[.．。、,，:：;；)）\]】\-–—]\s*/g;

function scanNumbered(flat) {
  const marks = [];
  let m;
  NUMBERED_RE.lastIndex = 0;
  while ((m = NUMBERED_RE.exec(flat)) !== null) {
    marks.push({ from: m.index + m[0].length, at: m.index });
  }
  return marks;
}

const PARSE_CJK = /[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]/;
const PARSE_HAS_LETTER = /[A-Za-z]/;
const PARSE_LOOSE = /^[A-Za-z][A-Za-z0-9'’./\-& ]*$/;

// 解析 Word 内容：同时用「整篇扫描」和「逐段解析」两种方式，取条数更多的那个
// 逐段能处理 Word 自动编号（<li> 无序号）；整篇扫描对跨段落 / 表格更宽容
// opts.plain = true 时按「纯文本词表」语义解析（.txt 导入）：一行即一个词条
function parseWordList(html, opts) {
  const plain = !!(opts && opts.plain);
  const blocks = htmlToBlocks(html)
    .split('\n')
    .map(function (s) { return s.trim(); })
    .filter(Boolean);

  function makeRun() {
    const result = [];
    const seen = new Set();
    const stats = { duplicates: [], rejected: [], unused: [] };

    function pushEntry(raw, source) {
      let content = String(raw == null ? '' : raw).split(PARSE_CJK)[0];
      content = content
        .replace(/^[\s"'\`*※·•●○◆◇\-–—,.、;:：]+/, '')
        .replace(/[\s"'\`*※·•●○◆◇\-–—,.;:：]+$/, '')
        .replace(/\s+\d+\s*$/, '')
        .replace(/\s+/g, ' ')
        .trim();

      if (!content || !/^[A-Za-z]/.test(content)) {
        stats.rejected.push(String(source == null ? '' : source).trim().slice(0, 60));
        return false;
      }

      const key = content.toLowerCase();
      if (seen.has(key)) {
        stats.duplicates.push(content);
        return true;
      }
      seen.add(key);

      // 不再查内置词典：先建空卡，导入完成后由 7.5 节的在线词典补齐
      result.push({
        word: content,
        pos: '',
        phonetic: '',
        meaningEn: '',
        meaningCn: '—',
        synonyms: [],
        antonyms: [],
        example: ''
      });
      return true;
    }

    return { result: result, stats: stats, pushEntry: pushEntry };
  }

  // ---- A：整篇扫描（等同旧版行为，但对格式更宽容）----
  const flat = blocks.join(' ');
  const runA = makeRun();
  const marks = scanNumbered(flat);
  for (let i = 0; i < marks.length; i++) {
    const end = (i + 1 < marks.length) ? marks[i + 1].at : flat.length;
    const chunk = flat.slice(marks[i].from, end);
    if (chunk.trim()) runA.pushEntry(chunk, chunk);
  }
  runA.stats.mode = 'inline';
  runA.stats.markers = marks.length;

  // ---- B：逐段解析（支持 Word 自动编号的列表项）----
  const runB = makeRun();
  blocks.forEach(function (block) {
    if (/^(单词|word)\s*(词义|meaning)$/i.test(block)) return;
    if (!PARSE_HAS_LETTER.test(block)) return;

    const localMarks = [];
    let m;
    NUMBERED_RE.lastIndex = 0;
    while ((m = NUMBERED_RE.exec(block)) !== null) {
      localMarks.push({ from: m.index + m[0].length, at: m.index });
    }

    let used = false;
    if (localMarks.length) {
      for (let i = 0; i < localMarks.length; i++) {
        const end = (i + 1 < localMarks.length) ? localMarks[i + 1].at : block.length;
        const chunk = block.slice(localMarks[i].from, end);
        if (chunk.trim() && runB.pushEntry(chunk, block)) used = true;
      }
    } else {
      let english = block.split(PARSE_CJK)[0].replace(/^[\s"'\`*※·•●○◆◇\-–—,.、;:：]+/, '').trim();
      english = english.replace(/^\d{1,4}[\s\u3000]+/, '').trim();  // “1 word”这种空格分隔的序号
      if (plain) {
        // 纯文本词表没有「这段是正文还是词条」的歧义：去掉编号/标点后以字母开头就整行收下。
        // 不限词数、不限长度，否则 “be keen on (doing sth)” 这类带括号或偏长的短语会被丢掉。
        used = runB.pushEntry(english, block);
      } else {
        const wordCount = english.split(/\s+/).length;
        const looksLikeEntry = PARSE_CJK.test(block)
          || (wordCount <= 2 && english.length <= 20)
          || (wordCount <= 4 && english.length <= 30);
        if (english && block.length <= 80 && PARSE_LOOSE.test(english) && looksLikeEntry) {
          used = runB.pushEntry(english, '');
        }
      }
    }
    if (!used) runB.stats.unused.push(block.slice(0, 60));
  });
  runB.stats.mode = 'blocks';

  // 两种方式取并集，尽量不丢词
  const useA = runA.result.length >= runB.result.length;
  const base = useA ? runA.result : runB.result;
  const extra = useA ? runB.result : runA.result;
  const primaryStats = useA ? runA.stats : runB.stats;

  const keys = new Set();
  base.forEach(function (w) { keys.add(String(w.word).toLowerCase()); });
  let mergedExtra = 0;
  extra.forEach(function (w) {
    const k = String(w.word).toLowerCase();
    if (!keys.has(k)) { keys.add(k); base.push(w); mergedExtra++; }
  });

  function candidateOf(line) {
    let s = String(line).split(PARSE_CJK)[0];
    s = s.replace(/^[\s"'\`*※·•●○◆◇\-–—,.、;:：]+/, '').replace(/^\d{1,4}[\s\u3000]+/, '');
    return s.trim();
  }

  // 已经被另一路收进来的行，不再算「未识别」
  const unused = runB.stats.unused.filter(function (line) {
    const cand = candidateOf(line);
    return !cand || !keys.has(cand.toLowerCase());
  });

  const stats = {
    mode: useA ? 'inline' : 'blocks',
    markers: runA.stats.markers,
    inlineCount: runA.result.length,
    blockCount: runB.result.length,
    mergedExtra: mergedExtra,
    duplicates: primaryStats.duplicates,
    rejected: primaryStats.rejected,
    unused: unused
  };

  parseWordList.lastStats = stats;
  return base;
}

/* =========================================================
   7.5 在线词典（唯一的释义来源）
   ---------------------------------------------------------
   本应用**不再内置词库**。导入词表后，每个空卡都在后台联网补全：
   - 中文释义 + 词性：有道 suggest 接口，走 JSONP——该接口不返回 CORS 头，
     但支持 callback，用 <script> 注入可绕过同源限制（与发音接口同一家）。
   - 英文释义 + 近反义词 + 音标：Datamuse API，带 CORS（连 file:// 的 null
     origin 也回显）。音标是 ARPAbet，需经 arpabetToIpa() 转成 IPA。
   - 结果按词缓存进 storage，二次补全零请求；只补空字段。
   - 任一接口失败都降级为「保持空卡」，不阻塞导入、不弹错误；下次联网自动回填。

   已知能力边界：
   - **没有例句来源。** 可跨域的免费接口都不提供例句，所以卡片上的例句区块
     在无值时整块隐藏（见 renderWord）。有道 jsonapi 有例句但既无 CORS、
     加 callback 也返回 403，浏览器无法调用。
   - **音标是美音近似值**，由 ARPAbet 机械转换而来，未经人工校对。
   - 关闭开关（localStorage 的 vn_online_dict_v1 = '0'）后没有任何本地兜底，
     **所有卡片都会是空的**；该开关只适合受限网络下临时禁用外部请求。
   ========================================================= */
const ONLINE_DICT_KEY   = 'vn_online_dict_v1';
const DICT_CACHE_KEY    = 'vn_dict_cache_v1';
const DICT_CACHE_MAX    = 4000;
const DICT_CACHE_TTL    = 1000 * 60 * 60 * 24 * 180;   // 缓存 180 天
const DICT_CONCURRENCY  = 4;
const DICT_TIMEOUT      = 8000;
const DICT_BACKFILL_MAX = 400;   // 每次启动最多补这么多词，避免打爆第三方接口

const onlineDict = {
  enabled: true,
  loaded: false,
  cache: {},
  pending: {},
  saveTimer: null,
  missing: function (w) { return !!w && (!w.meaningCn || w.meaningCn === '—'); }
};

// 默认开启自动补全；localStorage 里存 '0' 可永久关闭
function loadOnlineDictPref() {
  try {
    const v = localStorage.getItem(ONLINE_DICT_KEY);
    if (v === '0') onlineDict.enabled = false;
    else if (v === '1') onlineDict.enabled = true;
  } catch (e) {}
}

function onlineDictAvailable() {
  return onlineDict.enabled && navigator.onLine !== false;
}

async function loadDictCache() {
  if (onlineDict.loaded) return;
  onlineDict.loaded = true;
  const raw = await storage.get(DICT_CACHE_KEY);
  if (raw && typeof raw === 'object' && !Array.isArray(raw)) onlineDict.cache = raw;
}

function scheduleDictCacheSave() {
  if (onlineDict.saveTimer) return;
  onlineDict.saveTimer = setTimeout(function () {
    onlineDict.saveTimer = null;
    const keys = Object.keys(onlineDict.cache);
    if (keys.length > DICT_CACHE_MAX) {
      keys.map(function (k) { return { k: k, ts: onlineDict.cache[k].ts || 0 }; })
        .sort(function (a, b) { return a.ts - b.ts; })
        .slice(0, keys.length - DICT_CACHE_MAX)
        .forEach(function (e) { delete onlineDict.cache[e.k]; });
    }
    storage.set(DICT_CACHE_KEY, onlineDict.cache).then(function (res) {
      if (!res.ok) console.warn('词典缓存保存失败:', res.error);
    });
  }, 800);
}

// 通用 JSONP：回调名随机，超时与加载失败都会清理 <script> 并 reject
function jsonpRequest(url, timeoutMs) {
  return new Promise(function (resolve, reject) {
    const cb = '__vnDictCb' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let settled = false;
    const timer = setTimeout(function () { finish(new Error('timeout')); }, timeoutMs);

    function finish(err, data) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      if (err) reject(err); else resolve(data);
    }

    window[cb] = function (data) { finish(null, data); };
    script.onerror = function () { finish(new Error('network')); };
    script.src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'callback=' + cb;
    (document.head || document.documentElement).appendChild(script);
  });
}

function fetchJsonTimeout(url, timeoutMs) {
  return new Promise(function (resolve, reject) {
    let ctrl = null;
    try { ctrl = new AbortController(); } catch (e) {}
    const timer = setTimeout(function () { if (ctrl) ctrl.abort(); reject(new Error('timeout')); }, timeoutMs);
    fetch(url, ctrl ? { signal: ctrl.signal } : undefined).then(function (res) {
      if (!res || !res.ok) throw new Error('http ' + (res && res.status));
      return res.json();
    }).then(function (data) {
      clearTimeout(timer);
      resolve(data);
    }).catch(function (err) {
      clearTimeout(timer);
      reject(err);
    });
  });
}

const YOUDAO_POS_RE = /^([A-Za-z]+\.)\s*(.*)$/;

// 有道 explain 形如 "v. 阻止，阻碍；防止，预防；设置障碍; vi. 妨碍，阻止"
function parseYoudaoExplain(explain) {
  const posList = [];
  const cnList = [];
  String(explain).split(';').forEach(function (seg) {
    let s = seg.trim();
    if (!s) return;
    const m = s.match(YOUDAO_POS_RE);
    if (m) {
      if (posList.indexOf(m[1]) === -1) posList.push(m[1]);
      s = m[2].trim();
    }
    if (s) cnList.push(s);
  });
  const out = {};
  if (posList.length) out.pos = posList.join('/');
  if (cnList.length) out.meaningCn = cnList.join('；');
  return out;
}

async function lookupYoudao(word) {
  const url = 'https://dict.youdao.com/suggest?num=3&ver=3.0&doctype=json&cache=false&le=en&q=' +
    encodeURIComponent(word);
  const data = await jsonpRequest(url, DICT_TIMEOUT);
  const entries = data && data.data && data.data.entries;
  if (!Array.isArray(entries) || !entries.length) return null;
  const key = String(word).toLowerCase();
  let hit = null;
  for (let i = 0; i < entries.length; i++) {
    if (String(entries[i].entry || '').toLowerCase() === key) { hit = entries[i]; break; }
  }
  if (!hit) return null;   // suggest 会返回 prevention 这类近似词，宁可不要也不能张冠李戴
  if (!hit.explain) return null;
  return parseYoudaoExplain(hit.explain);
}

const DATAMUSE_POS = { n: 'n.', v: 'v.', adj: 'adj.', adv: 'adv.' };

/* ---------------------------------------------------------
   ARPAbet → IPA
   ---------------------------------------------------------
   Datamuse 的 tags 里带 "pron:S EH0 R AH0 N D IH1 P IH0 T IY0"，
   是 **ARPAbet 音素**而非 IPA，必须转换后才能显示。

   转换本身是一对一映射，难点在**重音符号的位置**：它属于整个音节，
   要放在音节首而不是元音前 —— 放在元音前会得到 /prˈaɪs/，
   正确的是 /ˈpraɪs/。所以要先按「最大音节首」原则把元音之间的
   辅音簇切给下一音节，再把符号放到该音节开头。

   ⚠️ 这是**美式**发音的机械转换结果，未经人工校对，与内置词典时代
   人工标注的英式 IPA 不同。词首辅音簇整体归本音节（英语没有以
   /str/ 这类三辅音结尾的音节），因此 instruction 得到 /ˌɪnˈstrʌkʃən/。
   --------------------------------------------------------- */
const ARPA_VOWEL = {
  AA: 'ɑ', AE: 'æ', AH: 'ʌ', AO: 'ɔ', AW: 'aʊ', AY: 'aɪ',
  EH: 'ɛ', ER: 'ɜːr', EY: 'eɪ', IH: 'ɪ', IY: 'iː', OW: 'oʊ',
  OY: 'ɔɪ', UH: 'ʊ', UW: 'uː'
};
const ARPA_CONSONANT = {
  B: 'b', CH: 'tʃ', D: 'd', DH: 'ð', F: 'f', G: 'ɡ', HH: 'h',
  JH: 'dʒ', K: 'k', L: 'l', M: 'm', N: 'n', NG: 'ŋ', P: 'p',
  R: 'r', S: 's', SH: 'ʃ', T: 't', TH: 'θ', V: 'v', W: 'w',
  Y: 'j', Z: 'z', ZH: 'ʒ'
};

// 合法的英语音节首辅音簇
const ONSET3 = { spr: 1, str: 1, skr: 1, spl: 1, skl: 1, skw: 1, spj: 1, stj: 1, skj: 1 };
const ONSET2 = {
  pr: 1, br: 1, tr: 1, dr: 1, kr: 1, 'ɡr': 1, fr: 1, 'θr': 1, 'ʃr': 1,
  pl: 1, bl: 1, kl: 1, 'ɡl': 1, fl: 1, sl: 1, sp: 1, st: 1, sk: 1,
  sm: 1, sn: 1, sw: 1, tw: 1, dw: 1, kw: 1, 'ɡw': 1, hj: 1, mj: 1,
  nj: 1, lj: 1, bj: 1, kj: 1, fj: 1, vj: 1, pj: 1, 'tʃ': 1, 'dʒ': 1
};

// 辅音簇里属于「下一音节首」的音素个数（最大音节首原则）
function onsetOf(cluster) {
  if (!cluster.length) return 0;   // 元音相邻：没有辅音可给，重音就落在该元音上
  for (let n = Math.min(3, cluster.length); n >= 1; n--) {
    const tail = cluster.slice(cluster.length - n).join('');
    if (n === 1) return 1;
    if (n === 2 && ONSET2[tail]) return 2;
    if (n === 3 && ONSET3[tail]) return 3;
  }
  return 1;
}

function arpabetToIpa(pron) {
  const raw = String(pron == null ? '' : pron).trim();
  if (!raw) return '';

  const units = [];
  raw.split(/\s+/).forEach(function (tok) {
    if (!tok) return;
    let stress = '';
    let base = tok;
    const last = tok.charAt(tok.length - 1);
    if (last === '0' || last === '1' || last === '2') {
      stress = last;
      base = tok.slice(0, -1);
    }
    const isVowel = Object.prototype.hasOwnProperty.call(ARPA_VOWEL, base);
    let sym;
    if (isVowel) {
      if (base === 'AH') sym = (stress === '0') ? 'ə' : 'ʌ';
      else if (base === 'ER') sym = (stress === '0') ? 'ər' : 'ɜːr';
      else sym = ARPA_VOWEL[base];
    } else {
      sym = ARPA_CONSONANT[base] || '';
    }
    if (!sym) return;
    units.push({ sym: sym, stress: stress, vowel: isVowel });
  });
  if (!units.length) return '';

  const marks = [];
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (!u.vowel || (u.stress !== '1' && u.stress !== '2')) continue;
    let j = i - 1;
    const cluster = [];
    while (j >= 0 && !units[j].vowel) { cluster.unshift(units[j].sym); j--; }
    const take = (j < 0) ? cluster.length : onsetOf(cluster);   // 词首辅音簇整体归本音节
    marks.push({ at: i - take, mark: (u.stress === '1') ? 'ˈ' : 'ˌ' });
  }

  let out = '';
  for (let i = 0; i < units.length; i++) {
    for (let k = 0; k < marks.length; k++) {
      if (marks[k].at === i) out += marks[k].mark;
    }
    out += units[i].sym;
  }
  return '/' + out + '/';
}

// 从 Datamuse 的 tags 里取音标
function pickPronunciation(tags) {
  if (!Array.isArray(tags)) return '';
  for (let i = 0; i < tags.length; i++) {
    const t = String(tags[i] || '');
    if (t.indexOf('pron:') === 0) {
      const ipa = arpabetToIpa(t.slice(5));
      if (ipa) return ipa;
    }
  }
  return '';
}

async function lookupDatamuse(word) {
  const q = encodeURIComponent(word);
  const base = 'https://api.datamuse.com/words?';
  const raws = await Promise.all([
    fetchJsonTimeout(base + 'sp=' + q + '&md=dpr&max=1', DICT_TIMEOUT).then(
      function (d) { return { ok: true, d: d }; }, function () { return { ok: false, d: null }; }),
    fetchJsonTimeout(base + 'rel_syn=' + q + '&max=6', DICT_TIMEOUT).then(
      function (d) { return { ok: true, d: d }; }, function () { return { ok: false, d: null }; }),
    fetchJsonTimeout(base + 'rel_ant=' + q + '&max=6', DICT_TIMEOUT).then(
      function (d) { return { ok: true, d: d }; }, function () { return { ok: false, d: null }; })
  ]);
  if (!raws[0].ok && !raws[1].ok && !raws[2].ok) throw new Error('datamuse unavailable');
  const results = [raws[0].d, raws[1].d, raws[2].d];
  const key = String(word).toLowerCase();
  const out = {};

  let entry = null;
  if (Array.isArray(results[0])) {
    for (let i = 0; i < results[0].length; i++) {
      if (String(results[0][i].word || '').toLowerCase() === key) { entry = results[0][i]; break; }
    }
  }
  if (entry) {
    if (Array.isArray(entry.defs) && entry.defs.length) {
      const def = String(entry.defs[0]);
      const tab = def.indexOf('\t');
      const posTag = tab > -1 ? def.slice(0, tab).trim() : '';
      let text = tab > -1 ? def.slice(tab + 1) : def;
      text = text.replace(/^(\([^)]*\)\s*)+/, '').replace(/\s+/g, ' ').trim();
      if (text) {
        if (text.length > 140) text = text.slice(0, 140).replace(/\s+\S*$/, '') + '…';
        out.meaningEn = text.charAt(0).toLowerCase() + text.slice(1);
      }
      if (DATAMUSE_POS[posTag]) out.pos = DATAMUSE_POS[posTag];
    }
    if (!out.pos && Array.isArray(entry.tags)) {
      for (let i = 0; i < entry.tags.length; i++) {
        if (DATAMUSE_POS[entry.tags[i]]) { out.pos = DATAMUSE_POS[entry.tags[i]]; break; }
      }
    }
    // 音标：Datamuse 是当前唯一可跨域的发音来源（ARPAbet → IPA）
    out.phonetic = pickPronunciation(entry.tags);
  }

  function pickWords(list) {
    if (!Array.isArray(list)) return [];
    const seen = {};
    const picked = [];
    list.forEach(function (item) {
      const w = String((item && item.word) || '').toLowerCase().trim();
      if (!w || w === key || seen[w]) return;
      if (!/^[a-z][a-z'’-]*( [a-z'’-]+)*$/.test(w)) return;
      seen[w] = true;
      if (picked.length < 4) picked.push(w);
    });
    return picked;
  }
  const syn = pickWords(results[1]);
  const ant = pickWords(results[2]);
  if (syn.length) out.synonyms = syn;
  if (ant.length) out.antonyms = ant;
  return Object.keys(out).length ? out : null;
}

// 单次查询：先查缓存；有道与 Datamuse 并行，任一边成功即可
function lookupOnline(word) {
  const key = String(word).toLowerCase();
  const cached = onlineDict.cache[key];
  if (cached && Date.now() - (cached.ts || 0) < DICT_CACHE_TTL) return Promise.resolve(cached);
  if (onlineDict.pending[key]) return onlineDict.pending[key];

  const p = Promise.all([
    lookupYoudao(word).then(function (d) { return { ok: true, d: d }; }, function () { return { ok: false, d: null }; }),
    lookupDatamuse(word).then(function (d) { return { ok: true, d: d }; }, function () { return { ok: false, d: null }; })
  ]).then(function (r) {
    const yd = r[0].d || {};
    const dm = r[1].d || {};
    const merged = {
      pos: yd.pos || dm.pos || '',
      phonetic: dm.phonetic || '',   // 音标只能来自 Datamuse
      meaningEn: dm.meaningEn || '',
      meaningCn: yd.meaningCn || '',
      synonyms: dm.synonyms || [],
      antonyms: dm.antonyms || [],
      example: '',
      source: (yd.meaningCn ? 'youdao' : '') + (dm.meaningEn ? (yd.meaningCn ? '+' : '') + 'datamuse' : ''),
      ts: Date.now()
    };
    merged.miss = !merged.meaningCn && !merged.meaningEn;
    // 至少一个来源在 HTTP 层正常应答（哪怕没查到该词）：用于判定「补全是否真的失败」
    merged.answered = !!(r[0].ok || r[1].ok);
    // 只有至少一个来源正常应答才写缓存；两边都是网络失败时不缓存，下次仍可重试
    if (r[0].ok || r[1].ok) {
      onlineDict.cache[key] = merged;
      scheduleDictCacheSave();
    }
    delete onlineDict.pending[key];
    return merged;
  });
  onlineDict.pending[key] = p;
  return p;
}

// 只填空字段，返回是否真的补到了东西
function applyOnlineEntry(w, r) {
  let filled = false;
  if (!w.pos && r.pos) { w.pos = r.pos; filled = true; }
  if (!w.phonetic && r.phonetic) { w.phonetic = r.phonetic; filled = true; }
  if (!w.meaningEn && r.meaningEn) { w.meaningEn = r.meaningEn; filled = true; }
  if ((!w.meaningCn || w.meaningCn === '—') && r.meaningCn) { w.meaningCn = r.meaningCn; filled = true; }
  if ((!w.synonyms || !w.synonyms.length) && r.synonyms && r.synonyms.length) { w.synonyms = r.synonyms; filled = true; }
  if ((!w.antonyms || !w.antonyms.length) && r.antonyms && r.antonyms.length) { w.antonyms = r.antonyms; filled = true; }
  if (!w.example && r.example) { w.example = r.example; filled = true; }
  return filled;
}

// 对一组词条联网补全：只处理缺释义的，最多 limit 个（limit 为 0 表示不限）
async function enrichWords(words, limit, onProgress) {
  await loadDictCache();
  const targets = [];
  let filled = 0;
  let answered = 0;

  for (let i = 0; i < words.length; i++) {
    if (!onlineDict.missing(words[i])) continue;

    /* 命中新鲜缓存：直接把缓存内容填进这张卡，而不是跳过。
       这里曾是个真实的 bug —— 旧实现把「有缓存」当成「无需处理」直接 continue，
       结果同一个词第二次导入（或换一个词汇本导入）时永远补不上：
       缓存明明有数据，卡片却一直空着。缓存的意义是省掉网络请求，
       不是省掉「把结果写进词条」这一步。 */
    const cached = onlineDict.cache[String(words[i].word).toLowerCase()];
    if (cached && Date.now() - (cached.ts || 0) < DICT_CACHE_TTL) {
      // 新鲜缓存意味着上次确实有来源应答过（无论查没查到），算作 answered
      answered++;
      if (!cached.miss && applyOnlineEntry(words[i], cached)) filled++;
      continue;
    }

    targets.push(i);
    if (limit && targets.length >= limit) break;
  }

  if (targets.length) {
    let done = 0;
    const queue = targets.slice();

    async function worker() {
      while (queue.length) {
        const idx = queue.shift();
        let r = null;
        try { r = await lookupOnline(words[idx].word); } catch (e) { r = null; }
        if (r && r.answered) answered++;
        if (r && !r.miss && applyOnlineEntry(words[idx], r)) filled++;
        done++;
        if (onProgress) onProgress(done, targets.length);
      }
    }

    const workers = [];
    for (let k = 0; k < DICT_CONCURRENCY; k++) workers.push(worker());
    await Promise.all(workers);
  }

  let remaining = 0;
  for (let i = 0; i < words.length; i++) {
    if (onlineDict.missing(words[i])) remaining++;
  }
  return { total: targets.length, filled: filled, remaining: remaining, answered: answered };
}

/* 导入后：联网补全新词汇本，成功才把骨架卡换成真实卡片。
   判定见 spec：有任一来源应答即算成功；离线或零应答算失败，交给用户重试或放行。 */
async function enrichBooks(list) {
  if (!list || !list.length) return { ok: false, filled: 0, remaining: 0 };

  // 联网开关关闭 / navigator.onLine === false：直接判失败，不空跑一轮超时。
  // 必须重绘：否则骨架卡会永远停在「联网补全中 0 / N」，看起来像卡死
  if (!onlineDictAvailable()) {
    list.forEach(function (b) { markPendingFailed(b.id); });
    renderHome();
    return { ok: false, filled: 0, remaining: 0 };
  }

  let total = 0;
  let filled = 0;
  let remaining = 0;
  let answered = 0;

  for (let i = 0; i < list.length; i++) {
    const book = list[i];
    const res = await enrichWords(book.words, 0, function (done, tot) {
      updatePendingProgress(book.id, done, tot);
    });
    total += res.total;
    filled += res.filled;
    remaining += res.remaining;
    answered += res.answered;
  }

  // total === 0 表示没有需要联网的词（全部命中新鲜缓存或本就不缺释义），也算成功
  const ok = answered > 0 || total === 0;

  /* 部分补到的内容同样要落盘，失败也不例外；落盘失败同样不算成功，
     否则用户看到的是「已就绪」但重开应用后内容不见了。 */
  const saved = await saveBooks(books);
  const success = ok && saved;

  list.forEach(function (b) {
    // 补全期间用户可能已经删掉了这本：不要给已删除的词汇本留下悬挂的 pending 条目
    if (success || !books.some(function (x) { return x.id === b.id; })) delete pendingBooks[b.id];
    else markPendingFailed(b.id);
  });

  renderHome();
  if (!studyView.hidden) renderWord(currentIndex);
  return { ok: success, filled: filled, remaining: remaining };
}

// 新导入词汇本的补全入口：跑完后按结果给出明确提示，绝不静默
async function runEnrichForNewBooks(list) {
  const res = await enrichBooks(list);
  if (!res.ok) {
    showToast('联网补全失败，词汇本已保存，可重试或先查看空卡', 5000);
    return res;
  }
  if (res.filled) {
    showToast('已联网补全 ' + res.filled + ' 词' +
      (res.remaining ? '，仍缺 ' + res.remaining + ' 词' : ''), 4000);
  } else if (res.remaining) {
    showToast('联网词典未收录这 ' + res.remaining + ' 词，卡片保持空白', 4000);
  } else {
    showToast('词汇本已就绪', 2400);
  }
  return res;
}

function markPendingLoading(id, total) {
  pendingBooks[id] = { status: 'loading', done: 0, total: total || 0 };
}

function markPendingFailed(id) {
  const st = pendingBooks[id];
  pendingBooks[id] = { status: 'failed', done: st ? st.done : 0, total: st ? st.total : 0 };
}

function updatePendingProgress(id, done, total) {
  const st = pendingBooks[id];
  if (!st || st.status !== 'loading') return;
  st.done = done;
  st.total = total;
  refreshPendingCard(id);
}

// 失败后重试：重新回到「联网补全中」
async function retryPendingBook(id) {
  const book = books.find(function (b) { return b.id === id; });
  if (!book) return;
  markPendingLoading(id, book.words.length);
  renderHome();
  await runEnrichForNewBooks([book]);
}

// 用户主动放行：接受空卡，正常呈现
function dismissPendingBook(id) {
  delete pendingBooks[id];
  renderHome();
}

// 启动后：后台回填已有词汇本里仍缺释义的词，每次启动设上限
let backfillRunning = false;
async function backfillMissingWords() {
  if (backfillRunning || !onlineDictAvailable() || !books.length) return;
  const targets = [];
  books.forEach(function (b) {
    if (b.words.some(function (w) { return onlineDict.missing(w); })) targets.push(b);
  });
  if (!targets.length) return;

  backfillRunning = true;
  try {
    let budget = DICT_BACKFILL_MAX;
    let filled = 0;
    for (let i = 0; i < targets.length && budget > 0; i++) {
      const res = await enrichWords(targets[i].words, budget, null);
      budget -= res.total;
      filled += res.filled;
    }
    if (filled) {
      if (!await saveBooks(books)) return;
      renderHome();
      if (!studyView.hidden) renderWord(currentIndex);
      showToast('已联网补全 ' + filled + ' 个词条', 3000);
    }
  } finally {
    backfillRunning = false;
  }
}

/* =========================================================
   8. 交互：翻转 / 切换 / 发音
   ========================================================= */
let touchStartY = 0;
let touchMoved = false;

flashcard.addEventListener('touchstart', function (e) {
  if (e.touches && e.touches.length) {
    touchStartY = e.touches[0].clientY;
  }
  touchMoved = false;
}, { passive: true });

flashcard.addEventListener('touchmove', function (e) {
  if (e.touches && e.touches.length) {
    if (Math.abs(e.touches[0].clientY - touchStartY) > 8) touchMoved = true;
  }
}, { passive: true });

flashcard.addEventListener('click', function (e) {
  if (touchMoved) { touchMoved = false; return; }
  if (e.target.closest('.audio-btn')) return;
  if (switching) return;   // 切换动画播放中：忽略翻转，避免状态与视觉不一致

  flashcard.classList.toggle('flipped');
  isFlipped = flashcard.classList.contains('flipped');
});

flashcard.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    flashcard.classList.toggle('flipped');
    isFlipped = flashcard.classList.contains('flipped');
  }
});

audioBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  const data = wordsData[currentIndex];
  if (data) speakWord(data.word);
});

document.getElementById('randomBtn').addEventListener('click', function () {
  if (wordsData.length < 2) return;
  let newIndex;
  do {
    newIndex = Math.floor(Math.random() * wordsData.length);
  } while (newIndex === currentIndex);
  // 随机没有前后概念，按目标页与当前页的大小比较定方向
  switchTo(newIndex, newIndex > currentIndex ? DIR_NEXT : DIR_PREV);
});

document.getElementById('nextBtn').addEventListener('click', function () {
  // 恒为向前：最后一张绕回第 1 张时目标页序号更小，但按钮语义仍是「下一张」
  switchTo((currentIndex + 1) % wordsData.length, DIR_NEXT);
});

/* 页码跳转：点击「1 / N」，输入页码回车即可跳到该页 */
let counterEditing = false;

function restoreCounter() {
  counter.textContent = (currentIndex + 1) + ' / ' + wordsData.length;
}

function startCounterEdit() {
  if (counterEditing || !wordsData.length) return;
  counterEditing = true;

  counter.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'counter-input';
  input.min = '1';
  input.max = String(wordsData.length);
  input.value = String(currentIndex + 1);
  input.setAttribute('aria-label', '输入页码跳转');
  const suffix = document.createElement('span');
  suffix.textContent = ' / ' + wordsData.length;
  counter.appendChild(input);
  counter.appendChild(suffix);
  try { input.focus(); input.select(); } catch (e) {}

  let done = false;
  function finish(cancel) {
    if (done) return;
    done = true;
    counterEditing = false;
    if (!cancel) {
      const n = parseInt(input.value, 10);
      if (isFinite(n)) {
        const target = Math.min(wordsData.length, Math.max(1, n)) - 1;
        // 跳到后面的页码 → 向前；跳到前面 → 向后；跳到当前页 → 不播
        switchTo(target, target === currentIndex ? 0 : (target > currentIndex ? DIR_NEXT : DIR_PREV));
        return;
      }
    }
    restoreCounter();
  }

  input.addEventListener('keydown', function (e) {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); finish(false); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(true); }
  });
  input.addEventListener('blur', function () { finish(false); });
}

counter.addEventListener('click', function (e) {
  if (e.target !== counter) return;
  startCounterEdit();
});
counter.addEventListener('keydown', function (e) {
  if (counterEditing) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startCounterEdit(); }
});

document.addEventListener('keydown', function (e) {
  if (studyView.hidden) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.target && e.target.closest && e.target.closest('.card')) return;
  if (e.key === 'ArrowRight') {
    switchTo((currentIndex + 1) % wordsData.length, DIR_NEXT);
  } else if (e.key === 'ArrowLeft') {
    switchTo((currentIndex - 1 + wordsData.length) % wordsData.length, DIR_PREV);
  }
});

/* =========================================================
   9. 启动
   ---------------------------------------------------------
   首次打开没有任何词汇本，展示空书架
   ========================================================= */
(async function init() {
  await storage.init();
  await migrateLegacyStorage();
  await loadProgress();
  loadOnlineDictPref();
  books = await loadBooks();
  renderHome();

  if (storage.mode === 'memory') {
    showToast('当前环境无法本地保存，刷新后已导入的词汇本会丢失', 5000);
  }

  // 已有词汇本里仍有缺释义的词条 → 联网静默回填（有上限，二次打开走缓存零请求）
  setTimeout(function () { backfillMissingWords(); }, 3000);
})();
</script>
